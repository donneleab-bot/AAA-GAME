<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreemurr Dynasty</title>
<style>
    /* ============================================================
       СТИЛИ ДРЕВА И КАРТЫ (DYNASTY)
       ============================================================ */
    .dyn-header {
        display: flex; justify-content: space-between; align-items: center;
        padding-bottom: 12px; border-bottom: 1px dashed #333; flex-wrap: wrap; gap: 10px;
    }
    .dyn-age { font-size: 14px; color: var(--accent); letter-spacing: 2px; }
    .dyn-health-container { display: flex; align-items: center; gap: 10px; font-size: 12px; }
    .dyn-health-bar {
        width: 120px; height: 12px; background: #111; border: 1px solid #333;
        padding: 2px; display: flex; gap: 2px;
    }
    .dyn-health-fill {
        height: 100%; background: #6f6; box-shadow: 0 0 8px #6f6; transition: width 0.3s;
    }
    .dyn-tabs { display: flex; gap: 8px; margin: 16px 0; }
    .dyn-tab {
        flex: 1; background: #060606; color: #666; font-family: inherit;
        font-size: 12px; padding: 12px; cursor: pointer; border: none;
        text-transform: uppercase; letter-spacing: 2px;
        box-shadow: 0 -2px 0 0 #1a1a1a, 0 2px 0 0 #1a1a1a, -2px 0 0 0 #1a1a1a, 2px 0 0 0 #1a1a1a;
    }
    .dyn-tab:hover { color: #aaa; }
    .dyn-tab.active {
        color: var(--accent); background: rgba(255,255,0,0.05);
        box-shadow: 0 -2px 0 0 var(--accent), 0 2px 0 0 var(--accent), -2px 0 0 0 var(--accent), 2px 0 0 0 var(--accent);
    }

    /* ДРЕВО */
    .tree-container {
        display: flex; flex-direction: column; align-items: center;
        gap: 20px; padding: 20px; background: #050505;
        box-shadow: inset 0 0 0 1px #1a1a1a; min-height: 300px;
    }
    .tree-row { display: flex; gap: 20px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
    .tree-node {
        display: flex; flex-direction: column; align-items: center;
        gap: 6px; width: 80px; cursor: pointer; transition: transform 0.2s;
    }
    .tree-node:hover { transform: scale(1.05); }
    .tree-portrait {
        width: 50px; height: 50px; border-radius: 50%;
        box-shadow: 0 0 0 2px #000, 0 0 0 3px #444; position: relative;
    }
    .tree-node.heir .tree-portrait {
        box-shadow: 0 0 0 2px #000, 0 0 0 3px var(--accent), 0 0 15px var(--accent);
    }
    .tree-node.dead .tree-portrait { filter: grayscale(1) brightness(0.3); }
    .tree-node.dead .tree-name { text-decoration: line-through; color: #555; }
    .tree-name { font-size: 11px; text-align: center; color: #ccc; }
    .tree-status { font-size: 9px; color: #666; text-align: center; }
    .tree-line-v { width: 2px; height: 20px; background: #333; margin: 0 auto; }

    /* КАРТА */
    .map-container {
        height: 300px; background: #050505;
        box-shadow: inset 0 0 0 1px #1a1a1a;
        position: relative; overflow: hidden;
        background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 30px 30px;
    }
    .map-node {
        position: absolute; width: 40px; height: 40px;
        transform: translate(-50%, -50%); cursor: pointer;
        display: flex; flex-direction: column; align-items: center;
    }
    .map-icon {
        width: 24px; height: 24px; border-radius: 50%;
        box-shadow: 0 0 0 2px #000, 0 0 0 3px #666; transition: all 0.2s;
    }
    .map-node:hover .map-icon {
        box-shadow: 0 0 0 2px #000, 0 0 0 3px var(--accent), 0 0 15px var(--accent); transform: scale(1.1);
    }
    .map-label { font-size: 9px; color: #888; margin-top: 4px; white-space: nowrap; text-shadow: 1px 1px 0 #000; }

    .info-panel {
        background: #080808; padding: 16px;
        box-shadow: inset 0 0 0 1px #222;
        margin-top: 16px; font-size: 12px; min-height: 100px;
    }
    .info-panel .panel-title { font-size: 14px; color: var(--accent); margin-bottom: 8px; }
    .info-panel .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .info-panel .stat-row { display: flex; justify-content: space-between; border-bottom: 1px dashed #222; padding-bottom: 4px; }
    .info-panel .actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .log-panel {
        font-size: 11px; max-height: 100px; overflow-y: auto;
        background: #050505; padding: 10px; box-shadow: inset 0 0 0 1px #1a1a1a;
        margin-top: 16px; color: #888;
    }
    .log-entry { border-bottom: 1px dashed #111; padding: 3px 0; }
    .log-entry.danger { color: #f66; }
    .log-entry.love { color: #f6a; }
    .log-entry.death { color: #888; }
</style>
</head>
<body>
<div id="app">
    <!-- ЭКРАН ДИНАСТИИ -->
    <div class="screen px-box" id="screen-dynasty">
        <div class="dyn-header">
            <div class="dyn-age">Род Дриммурров · <span id="dyn-age">20</span> лет</div>
            <div class="dyn-health-container">
                Здоровье
                <div class="dyn-health-bar"><div class="dyn-health-fill" id="dyn-health" style="width: 70%;"></div></div>
            </div>
            <div style="display: flex; gap: 4px;">
                <button class="nav-btn" style="padding: 4px 8px; font-size: 10px;" onclick="setSpeed(0)">❚❚</button>
                <button class="nav-btn next" style="padding: 4px 8px; font-size: 10px;" onclick="setSpeed(1)">▶</button>
                <button class="nav-btn" style="padding: 4px 8px; font-size: 10px;" onclick="setSpeed(2)">▶▶</button>
            </div>
        </div>
        <div class="dyn-tabs">
            <button class="dyn-tab active" data-tab="palace" onclick="switchTab('palace')">Дворец</button>
            <button class="dyn-tab" data-tab="war" onclick="switchTab('war')">Война</button>
            <button class="dyn-tab" data-tab="people" onclick="switchTab('people')">Граждане</button>
        </div>
        <div id="dyn-content" style="flex: 1;"></div>
        <div class="log-panel" id="dyn-log"></div>
        <div class="nav-row">
            <button class="nav-btn" onclick="goTo('origin')">← В меню</button>
        </div>
    </div>
</div>
<script>
/* ============================================================
   ДВИЖОК ДИНАСТИИ (СЕМЬЯ, ВРЕМЯ, ТЕРРИТОРИИ)
   ============================================================ */
const Dynasty = {
    age: 20, health: 70, timeSpeed: 1,
    family: { spouses: [], children: [], heir: null },
    territories: [
        { id: 'capital', name: 'Столица', x: 50, y: 50, type: 'capital', color: '#ff0', income: 20, def: 10, loyalty: 80 },
        { id: 'north', name: 'Северный Хребет', x: 50, y: 20, type: 'mountain', color: '#888', income: 10, def: 30, loyalty: 60 },
        { id: 'east', name: 'Восточные Пустоши', x: 80, y: 50, type: 'wasteland', color: '#c96', income: 5, def: 5, loyalty: 40 },
        { id: 'south', name: 'Южные Луга', x: 50, y: 80, type: 'fields', color: '#6f6', income: 15, def: 5, loyalty: 90 },
        { id: 'west', name: 'Западные Топи', x: 20, y: 50, type: 'swamp', color: '#6a8', income: 8, def: 15, loyalty: 50 }
    ],
    logs: []
};

let tickInterval = null;

function startDynasty() {
    initFamily();
    document.getElementById('dyn-age').textContent = Dynasty.age;
    document.getElementById('dyn-health').style.width = Dynasty.health + '%';
    goTo('dynasty');
    switchTab('palace');
    startTime();
}

function initFamily() {
    Dynasty.family.spouses = [];
    Dynasty.family.children = [];
    Dynasty.family.heir = null;
    Dynasty.logs = [];
    
    if (state.gender === 'male') {
        Dynasty.family.spouses.push({ id: 'sp1', name: 'Королева Ашера', status: 'wife', love: 70, fertility: 60 });
    } else {
        Dynasty.family.spouses.push({ id: 'sp1', name: 'Лорд-консорт Эйден', status: 'wife', love: 70, fertility: 60 });
    }
    
    const childGender = Math.random() < 0.5 ? 'male' : 'female';
    const childName = childGender === 'male' ? 'Принц Тор' : 'Принцесса Мира';
    Dynasty.family.children.push({
        id: 'ch1', name: childName, gender: childGender, age: 5,
        health: 80, love: 70, motherId: 'sp1', status: 'alive'
    });
    Dynasty.family.heir = 'ch1';
    
    addLog(`Вы взошли на трон. Двор приветствует вас.`, 'love');
}

function addLog(text, type = '') {
    Dynasty.logs.push({ text, type });
    if (Dynasty.logs.length > 50) Dynasty.logs.shift();
    renderLog();
}

function renderLog() {
    const log = document.getElementById('dyn-log');
    if (!log) return;
    log.innerHTML = Dynasty.logs.map(l => `<div class="log-entry ${l.type}">${l.text}</div>`).join('') || 'Хроника пуста';
}

function switchTab(tab) {
    document.querySelectorAll('.dyn-tab').forEach(t => t.classList.remove('active'));
    const tabBtn = document.querySelector(`.dyn-tab[data-tab="${tab}"]`);
    if (tabBtn) tabBtn.classList.add('active');
    
    const content = document.getElementById('dyn-content');
    if (tab === 'palace') {
        content.innerHTML = `
            <div class="tree-container" id="family-tree"></div>
            <div class="info-panel" id="info-panel">Нажмите на члена семьи или территорию</div>
            <div class="map-container" id="territory-map"></div>
        `;
        renderTree();
        renderMap();
    } else if (tab === 'war') {
        content.innerHTML = `<div class="info-panel">Война (в разработке)</div>`;
    } else if (tab === 'people') {
        content.innerHTML = `<div class="info-panel">Граждане (в разработке)</div>`;
    }
    renderLog();
}

function renderTree() {
    const tree = document.getElementById('family-tree');
    if (!tree) return;
    
    let spousesHtml = Dynasty.family.spouses.map(sp => `
        <div class="tree-node" onclick="selectNode('spouse', '${sp.id}')">
            <div class="tree-portrait" style="background: radial-gradient(circle, #f6a, #a33);"></div>
            <div class="tree-name">${sp.name}</div>
            <div class="tree-status">${sp.status === 'wife' ? 'Жена' : 'Наложница'} · ♥${sp.love}</div>
        </div>
    `).join('');

    const heroHtml = `
        <div class="tree-node heir" onclick="selectNode('hero')">
            <div class="tree-portrait" style="background: radial-gradient(circle, #ff0, #aa0);"></div>
            <div class="tree-name">Вы</div>
            <div class="tree-status">${Dynasty.age} лет</div>
        </div>
    `;

    const byMother = {};
    Dynasty.family.children.forEach(ch => {
        if (!byMother[ch.motherId]) byMother[ch.motherId] = [];
        byMother[ch.motherId].push(ch);
    });

    let childrenHtml = Object.keys(byMother).map(mid => {
        const mother = Dynasty.family.spouses.find(s => s.id === mid);
        const kids = byMother[mid].map(ch => `
            <div class="tree-node ${Dynasty.family.heir === ch.id ? 'heir' : ''} ${ch.status === 'dead' ? 'dead' : ''}" onclick="selectNode('child', '${ch.id}')">
                <div class="tree-portrait" style="background: radial-gradient(circle, ${ch.gender === 'male' ? '#3cf' : '#f6a'}, #222);"></div>
                <div class="tree-name">${ch.name}</div>
                <div class="tree-status">${ch.age} лет</div>
            </div>
        `).join('');
        return `<div style="display: flex; flex-direction: column; align-items: center;">
            <div class="tree-line-v"></div>
            <div style="font-size: 9px; color: #555; margin-bottom: 4px;">от ${mother ? mother.name : '—'}</div>
            <div class="tree-row">${kids}</div>
        </div>`;
    }).join('');

    tree.innerHTML = `
        <div class="tree-row">${heroHtml}${spousesHtml}</div>
        ${childrenHtml ? `<div class="tree-line-v"></div><div class="tree-row">${childrenHtml}</div>` : ''}
    `;
}

function renderMap() {
    const map = document.getElementById('territory-map');
    if (!map) return;
    map.innerHTML = '';
    Dynasty.territories.forEach(t => {
        const node = document.createElement('div');
        node.className = 'map-node';
        node.style.left = t.x + '%';
        node.style.top = t.y + '%';
        node.innerHTML = `<div class="map-icon" style="background: ${t.color}"></div><div class="map-label">${t.name}</div>`;
        node.onclick = () => selectTerritory(t);
        map.appendChild(node);
    });
}

function selectNode(type, id) {
    AudioEngine.select();
    const panel = document.getElementById('info-panel');
    if (!panel) return;
    
    if (type === 'hero') {
        panel.innerHTML = `<div class="panel-title">Государь</div><div>Возраст: ${Dynasty.age}</div>`;
    } else if (type === 'spouse') {
        const sp = Dynasty.family.spouses.find(s => s.id === id);
        panel.innerHTML = `
            <div class="panel-title">${sp.name}</div>
            <div class="stats">
                <div class="stat-row"><span>Статус:</span><span>${sp.status === 'wife' ? 'Жена' : 'Наложница'}</span></div>
                <div class="stat-row"><span>Любовь:</span><span>${sp.love}</span></div>
            </div>
            <div class="actions">
                <button class="btn" onclick="actionGift('${sp.id}')">Подарок (+10 ♥)</button>
                <button class="btn" onclick="actionPunish('${sp.id}')">Наказать (-20 ♥)</button>
            </div>
        `;
    } else if (type === 'child') {
        const ch = Dynasty.family.children.find(c => c.id === id);
        const mother = Dynasty.family.spouses.find(s => s.id === ch.motherId);
        panel.innerHTML = `
            <div class="panel-title">${ch.name}</div>
            <div class="stats">
                <div class="stat-row"><span>Возраст:</span><span>${ch.age}</span></div>
                <div class="stat-row"><span>Здоровье:</span><span>${ch.health}</span></div>
                <div class="stat-row"><span>Мать:</span><span>${mother ? mother.name : '—'}</span></div>
            </div>
            <div class="actions">
                ${ch.status !== 'dead' ? `<button class="btn" onclick="actionHeir('${ch.id}')">Сделать наследником</button>` : ''}
            </div>
        `;
    }
}

function selectTerritory(t) {
    AudioEngine.select();
    const panel = document.getElementById('info-panel');
    if (!panel) return;
    panel.innerHTML = `
        <div class="panel-title">${t.name}</div>
        <div class="stats">
            <div class="stat-row"><span>Доход:</span><span>${t.income}</span></div>
            <div class="stat-row"><span>Защита:</span><span>${t.def}</span></div>
        </div>
        <div class="actions"><button class="btn" onclick="AudioEngine.confirm()">Улучшить (в разработке)</button></div>
    `;
}

function actionGift(id) {
    const sp = Dynasty.family.spouses.find(s => s.id === id);
    sp.love = Math.min(100, sp.love + 10);
    addLog(`Вы одарили ${sp.name}.`, 'love');
    selectNode('spouse', id);
    renderTree();
}

function actionPunish(id) {
    const sp = Dynasty.family.spouses.find(s => s.id === id);
    sp.love = Math.max(0, sp.love - 20);
    addLog(`${sp.name} наказана.`, 'danger');
    selectNode('spouse', id);
    renderTree();
}

function actionHeir(id) {
    Dynasty.family.heir = id;
    const ch = Dynasty.family.children.find(c => c.id === id);
    addLog(`${ch.name} назначен наследником.`, 'love');
    selectNode('child', id);
    renderTree();
}

function startTime() {
    if (tickInterval) clearInterval(tickInterval);
    tickInterval = setInterval(gameTick, 1000);
}

function gameTick() {
    if (Dynasty.timeSpeed === 0) return;
    if (Math.random() < 0.1) advanceYear();
}

function advanceYear() {
    Dynasty.age++;
    Dynasty.health = Math.max(0, Dynasty.health - (Math.random() < 0.2 ? 1 : 0));
    document.getElementById('dyn-age').textContent = Dynasty.age;
    document.getElementById('dyn-health').style.width = Dynasty.health + '%';

    Dynasty.family.children.forEach(ch => {
        if (ch.status === 'dead') return;
        ch.age++;
        const mother = Dynasty.family.spouses.find(s => s.id === ch.motherId);
        const motherLove = mother ? mother.love : 0;
        if (ch.age < 14) {
            if (motherLove > 60) ch.health = Math.min(100, ch.health + 2);
            else if (motherLove < 30) ch.health = Math.max(0, ch.health - 5);
            if (ch.health <= 0) {
                ch.status = 'dead';
                addLog(`${ch.name} умер(ла) от недосмотра матери.`, 'death');
            }
        }
    });

    Dynasty.family.spouses.forEach(sp => {
        if (sp.status === 'dead') return;
        if (sp.fertility > 0 && Math.random() < 0.2) {
            giveBirth(sp);
            sp.fertility -= 10;
        }
    });

    renderTree();
}

function giveBirth(mother) {
    const gender = Math.random() < 0.5 ? 'male' : 'female';
    const name = gender === 'male' ? 'Принц ' + Math.floor(Math.random()*10) : 'Принцесса ' + Math.floor(Math.random()*10);
    Dynasty.family.children.push({
        id: 'ch_' + Date.now(), name, gender, age: 0,
        health: 50 + Math.round(mother.love / 2), love: mother.love, motherId: mother.id, status: 'alive'
    });
    addLog(`${mother.name} родила ${name}.`, 'love');
}

function setSpeed(speed) {
    Dynasty.timeSpeed = speed;
    AudioEngine.hover();
    if (speed === 0) addLog("Время остановлено.");
    else addLog("Время ускорилось.");
}
</script>
</body>
</html>
